[build-system]
requires = ["setuptools>=80,<81"]
build-backend = "setuptools.build_meta"

[project]
name = "leomoon-jalalitray"
version = "0.0.0"
description = "A system tray Jalali calendar and date converter."
readme = "README.md"
requires-python = ">=3.12"
authors = [{ name = "LeoMoon Studios" }]
classifiers = [
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.12",
]
dependencies = ["PySide6>=6.12,<7"]

[project.gui-scripts]
leomoon-jalalitray = "leomoon_jalalitray.app:main"

[tool.setuptools]
package-dir = { "" = "src" }

[tool.setuptools.packages.find]
where = ["src"]
include = ["leomoon_jalalitray*"]

[tool.setuptools.package-data]
leomoon_jalalitray = ["assets/fonts/*.ttf", "assets/icons/*", "assets/tray/*.svg", "ui/*.qrc", "ui/*.ui"]

[tool.pytest.ini_options]
testpaths = ["tests"]
